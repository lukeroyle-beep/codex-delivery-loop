name: Validate delivery loop

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill package
        run: python3 scripts/validate.py package .
      - name: Validate contract fixture
        run: python3 scripts/validate.py contract tests/valid-issue.md
